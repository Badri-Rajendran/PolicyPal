# California carriers' SBCs (ADR 0026). Each is a federally mandated disclosure,
# not a licensed work, so commercial use stays under review. A carrier whose
# website Terms ban robots or scrapers is manual-only, whatever its robots.txt
# says: a person downloads its SBCs in a browser and `make import-sbc` reads
# them. Removal for every one: set enabled = false, then
# `make apply-sbc-manifest YEAR=…`; its plans lose their links, and its PDFs
# are kept (ADR 0016). Evidence per carrier: docs/findings/ca-sbc.md.

