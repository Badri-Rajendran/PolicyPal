# Every source PolicyPal reads or links, and whether it may be used (ADR 0025).
# `enabled = true` needs permission_status public_domain, open_license,
# written_permission or mandated_disclosure; registry.py refuses anything else
# when it loads. mandated_disclosure is only for an sbc_host (an issuer's SBC,
# which federal law requires it to publish), with commercial_use "review" (ADR 0026).
# Record a refused source too, disabled, so the decision is not re-litigated.

