name: CI

on:
  # Every pull request, not only those targeting main: a stacked PR based on
  # another branch needs the same gate as any other, and the branch filter
  # silently gave it none.
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: policypal
          POSTGRES_PASSWORD: policypal
          POSTGRES_DB: policypal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policypal -d policypal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://policypal:policypal@localhost:5432/policypal
      JWT_SECRET_KEY: ci-only-secret-never-used-outside-this-workflow
      # Settings require this to construct. No test may reach the API, so a
      # placeholder is correct here — a real key would mean CI can spend money.
      OPENAI_API_KEY: ci-only-placeholder-no-test-may-call-the-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check for schema drift
        run: uv run alembic check

      - name: Test (with coverage floor)
        run: uv run pytest -q --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: SAST (bandit)
        run: uv run bandit -r src -ll

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24, not 20: jsdom 30 and vitest 5 need Node >= 22.13. On 20 every
          # test file dies at worker startup with
          # "webidl.util.markAsUncloneable is not a function" — that API
          # landed in Node 22.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  # Closes the first of ADR 0002's two deferred items. The image is built and
  # scanned on every PR; pushing it anywhere is the deploy workflow's job.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build the API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: policypal-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The PDFs and the corpus are local-only (ADR 0016) and .dockerignore
      # excludes data/. A regression there would ship gigabytes of issuer
      # documents, so it is checked rather than trusted.
      - name: The image must carry no issuer documents
        env:
          IMAGE: policypal-api:${{ github.sha }}
        run: |
          set -euo pipefail
          found=$(docker run --rm --entrypoint sh "$IMAGE" -c 'ls -A /app/data 2>/dev/null | wc -l')
          test "$found" -eq 0 || { echo "data/ reached the image"; exit 1; }

      - name: Scan the image
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: policypal-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan for committed secrets
        run: ./gitleaks detect --no-banner --redact --source .
